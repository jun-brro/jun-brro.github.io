papers:
  - title: "Human-to-Robot Transfer via Bridging Representation and Action Space in VLAs"
    thumbnail: "/assets/publications/h2rb.png"
    authors_list:
      - name: "Junhyeong Park"
        me: true
      - name: "Wook Jung"
      - name: "Taeyoung Kim"
      - name: "Huiwon Jang"
      - name: "Jinwoo Shin"
    venue: "<b>CoRL 2026 Workshop (Scaling H2R)</b> <b style='color:#c53030;'>Oral Presentation</b>"
    paper_pdf: "https://arxiv.org/abs/2611.04391"
    code: "https://github.com/jun-brro/h2rb-code"
    project_page: "https://junhyeong-park.me/h2rb"
    abstract: >
      Pretrained Vision-Language-Action (VLA) policies provide a strong starting
      point for deployment, but adapting them to a target robot and environment
      still requires costly embodiment-specific demonstrations. Human
      demonstrations are far easier to collect, yet directly leveraging them is
      challenging due to the substantial human-robot embodiment gap,
      particularly when the underlying VLA has been pretrained primarily on
      robot data. We introduce H2RB (Human-To-Robot Bridge), a human-robot co-
      training framework for adapting pretrained VLA policies from unpaired
      human and robot demonstrations. H2RB bridges the embodiment gap at both
      interfaces: geometry-anchored alignment grounds human and robot
      observations in a compatible representation, while a decoupled-decoder
      tokenizer shares action latents without forcing both domains through a
      single action mapping. This design allows human demonstrations to provide
      useful behavioral supervision while retaining the rich visual, semantic,
      and control priors of the pretrained VLA. Across real-world tasks, H2RB
      substantially improves object transfer performance from 8.0 to 51.8 and
      enables skill transfer to score 62.7, in settings where co-train baselines
      totally fail to transfer human-demonstrated skills. The benefit also
      persists under object-placement shifts, improving out-of-distribution
      transfer from 6.0 to 45.3. H2RB suggests a way for human demonstrations to
      serve as a scalable supervision source for adapting pretrained robotic
      policies, reducing the dependence on costly target-robot data collection.
    selected: y

  - title: "RLDX-1 Technical Report"
    thumbnail: "/assets/publications/rldx.png"
    authors: "RLDX Team (Core contributor)"
    venue: "<b>RLWRLD Technical Report 2026</b>"
    paper_pdf: "https://arxiv.org/abs/2605.03269"
    code: "https://github.com/RLWRLD/RLDX-1"
    project_page: "https://www.rlwrld.ai/en/rldx-1"
    abstract: >
      While Vision-Language-Action models (VLAs) have shown remarkable progress
      toward human-like generalist robotic policies through the versatile
      intelligence (broad scene understanding and language-conditioned
      generalization) inherited from pre-trained Vision-Language Models, they
      still struggle with complex real-world tasks requiring broader functional
      capabilities such as motion awareness, long-term memory, and physical
      sensing. To address this, we introduce RLDX-1, a general-purpose robotic
      policy for dexterous manipulation built on the Multi-Stream Action
      Transformer (MSAT), an architecture that unifies these capabilities by
      integrating heterogeneous modalities through modality-specific streams
      with cross-modal joint self-attention. RLDX-1 further combines this
      architecture with system-level design choices, including data synthesis
      for rare manipulation scenarios, learning procedures specialized for
      human-like manipulation, and inference optimizations for real-time
      deployment. Through empirical evaluation, we show that RLDX-1 consistently
      outperforms recent frontier VLAs across both simulation benchmarks and
      real-world tasks that require broad functional capabilities beyond general
      versatility. In particular, RLDX-1 shows superiority in ALLEX humanoid
      tasks by achieving success rates of 86.8%, highlighting its ability to
      control a high-DoF humanoid robot under diverse functional demands.
      Together, these results position RLDX-1 as a promising step toward
      reliable VLAs for complex, contact-rich, and dynamic real-world dexterous
      manipulation.
    selected: y

  - title: "Are Any-to-Any Models More Consistent Across Modality Transfers Than Specialists?"
    thumbnail: "/assets/publications/acon.png"
    authors_list:
      - "Jiwan Chung"
      - "Janghan Yoon"
      - "Junhyeong Park"
      - "Sangeyl Lee"
      - "Joowon Yang"
      - "Sooyeon Park"
      - "Youngjae Yu"
    venue: "<b>ACL 2025 Poster</b>"
    paper_pdf: "https://arxiv.org/abs/2505.24211"
    code: "https://github.com/JiwanChung/ACON"
    data: "https://huggingface.co/datasets/jiwan-chung/ACON"
    abstract: >
      Any-to-any generative models aim to enable seamless interpretation and
      generation across multiple modalities within a unified framework, yet
      their ability to preserve relationships across modalities remains
      uncertain. Do unified models truly achieve cross-modal coherence, or is
      this coherence merely perceived? To explore this, we introduce ACON, a
      dataset of 1,000 images (500 newly contributed) paired with captions,
      editing instructions, and Q&A pairs to evaluate cross-modal transfers
      rigorously. Using three consistency criteria—cyclic consistency, forward
      equivariance, and conjugated equivariance—our experiments reveal that
      any-to-any models do not consistently demonstrate greater cross-modal
      consistency than specialized models in pointwise evaluations such as
      cyclic consistency. However, equivariance evaluations uncover weak but
      observable consistency through structured analyses of the intermediate
      latent space enabled by multiple editing operations.
    selected: y

  - title: "Multimodal Safety Evaluation Should Measure Controllability Beyond Classification"
    thumbnail: "/assets/publications/position.png"
    authors_list:
      - name: "Junhyeong Park"
        me: true
        equal: true
      - name: "Hanwool Lee"
        equal: true
      - name: "DongGeon Lee"
      - name: "Dasol Choi"
      - name: "Yejin Son"
      - name: "Haon Park"
      - name: "Youngjae Yu"
    venue: "Arxiv preprint"
    paper_pdf: "https://arxiv.org/abs/2610.06452"
    abstract: >
      VLM safety is commonly evaluated through input- and output-level
      classification. Such classification is necessary, but it does not reveal
      whether a safety state is accessible or controllable inside the model.
      We argue that multimodal safety evaluation should therefore report a
      controllability profile alongside behavioral classification, separating
      representation-level detectability, cross-modal specificity, intervention
      sensitivity, and benign-preserving selectivity. Using implicit toxicity
      as a stress case, we instantiate this profile on LlavaGuard and Qwen3.5
      with sparse feature decompositions. LlavaGuard admits localized handles
      with a narrow benign-preserving intervention range and modest downstream
      safety gains, whereas Qwen3.5 supports strong representation-level
      readout but no comparable selective-control regime under the tested
      operators. These results show that internal readout and controllability
      can diverge. Future multimodal safety benchmarks should therefore report
      not only behavioral safety metrics, but also whether safety-relevant
      internal signals can be intervention-tested and controlled within a
      validated operating range.
    selected: y
  
  - title: "InfoCausalQA:Can Models Perform Non-explicit Causal Reasoning Based on Infographic?"
    thumbnail: "/assets/publications/infocausal.png"
    authors_list:
      - name: "Keummin Ka"
        equal: true
      - name: "Junhyeong Park"
        me: true
        equal: true
      - name: "Jaehyun Jeon"
      - name: "Youngjae Yu"
    venue: "<b>KCC 2026 Oral Presentation</b>"
    paper_pdf: "https://arxiv.org/abs/2508.06220"
    abstract: >
      Recent advances in Vision-Language Models (VLMs) have demonstrated
      impressive capabilities in perception and reasoning. However, the ability
      to perform causal inference—a core aspect of human cognition—remains
      underexplored, particularly in multimodal settings. In this study, we
      introduce InfoCausalQA, a novel benchmark designed to evaluate causal
      reasoning grounded in infographics that combine structured visual data
      with textual context. The benchmark comprises two tasks: quantitative
      causal reasoning based on inferred numerical trends, and semantic causal
      reasoning involving five types of causal relations (cause, effect,
      intervention, counterfactual, and temporal). We manually collected 494
      infographic-text pairs from four public sources and used GPT-4o to
      generate 1,482 high-quality multiple-choice QA pairs, then carefully
      revised by humans so they cannot be answered from surface-level cues alone
      but instead require genuine visual grounding. Our results reveal that
      current VLMs exhibit limited capability in computational reasoning and even
      more pronounced limitations in semantic causal reasoning, with performance
      significantly lower than humans. Through InfoCausalQA, we highlight the
      need for advancing the causal reasoning abilities of multimodal AI
      systems.
    selected: y
