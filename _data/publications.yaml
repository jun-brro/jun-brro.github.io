  - title: "InfoCausalQA:Can Models Perform Non-explicit Causal Reasoning Based on Infographic?"
    thumbnail: "/assets/publications/infocausal.png"
    authors_list:
      - name: "Keummin Ka"
        equal: true
      - name: "Junhyeong Park"
        me: true
        equal: true
      - name: "Jaehyun Jeon"
      - name: "Youngjae Yu"
    venue: "KCC 2026 Oral"
    paper_pdf: "https://arxiv.org/abs/2508.06220"
    abstract: >
      Recent advances in Vision-Language Models (VLMs) have demonstrated
      impressive capabilities in perception and reasoning. However, the ability
      to perform causal inference—a core aspect of human cognition—remains
      underexplored, particularly in multimodal settings. In this study, we
      introduce InfoCausalQA, a novel benchmark designed to evaluate causal
      reasoning grounded in infographics that combine structured visual data
      with textual context. The benchmark comprises two tasks: quantitative
      causal reasoning based on inferred numerical trends, and semantic causal
      reasoning involving five types of causal relations (cause, effect,
      intervention, counterfactual, and temporal). We manually collected 494
      infographic-text pairs from four public sources and used GPT-4o to
      generate 1,482 high-quality multiple-choice QA pairs, then carefully
      revised by humans so they cannot be answered from surface-level cues alone
      but instead require genuine visual grounding. Our results reveal that
      current VLMs exhibit limited capability in computational reasoning and even
      more pronounced limitations in semantic causal reasoning, with performance
      significantly lower than humans. Through InfoCausalQA, we highlight the
      need for advancing the causal reasoning abilities of multimodal AI
      systems.
    selected: y
