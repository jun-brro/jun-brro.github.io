papers:
  - title: "RLDX-1 Technical Report"
    thumbnail: "/assets/publications/rldx.png"
    authors: "RLDX Team (Core contributor)"
    venue: "RLWRLD Technical Report 2026"
    paper_pdf: "https://arxiv.org/abs/2605.03269"
    code: "https://github.com/RLWRLD/RLDX-1"
    project_page: "https://www.rlwrld.ai/en/rldx-1"
    abstract: >
      While Vision-Language-Action models (VLAs) have shown remarkable progress
      toward human-like generalist robotic policies through the versatile
      intelligence (broad scene understanding and language-conditioned
      generalization) inherited from pre-trained Vision-Language Models, they
      still struggle with complex real-world tasks requiring broader functional
      capabilities such as motion awareness, long-term memory, and physical
      sensing. To address this, we introduce RLDX-1, a general-purpose robotic
      policy for dexterous manipulation built on the Multi-Stream Action
      Transformer (MSAT), an architecture that unifies these capabilities by
      integrating heterogeneous modalities through modality-specific streams
      with cross-modal joint self-attention. RLDX-1 further combines this
      architecture with system-level design choices, including data synthesis
      for rare manipulation scenarios, learning procedures specialized for
      human-like manipulation, and inference optimizations for real-time
      deployment. Through empirical evaluation, we show that RLDX-1 consistently
      outperforms recent frontier VLAs across both simulation benchmarks and
      real-world tasks that require broad functional capabilities beyond general
      versatility. In particular, RLDX-1 shows superiority in ALLEX humanoid
      tasks by achieving success rates of 86.8%, highlighting its ability to
      control a high-DoF humanoid robot under diverse functional demands.
      Together, these results position RLDX-1 as a promising step toward
      reliable VLAs for complex, contact-rich, and dynamic real-world dexterous
      manipulation.
    selected: y

  - title: "Are Any-to-Any Models More Consistent Across Modality Transfers Than Specialists?"
    thumbnail: "/assets/publications/acon.png"
    authors_list:
      - "Jiwan Chung"
      - "Janghan Yoon"
      - "Junhyeong Park"
      - "Sangeyl Lee"
      - "Joowon Yang"
      - "Sooyeon Park"
      - "Youngjae Yu"
    venue: "ACL 2025 Poster"
    paper_pdf: "https://arxiv.org/abs/2505.24211"
    code: "https://github.com/JiwanChung/ACON"
    data: "https://huggingface.co/datasets/jiwan-chung/ACON"
    abstract: >
      Any-to-any generative models aim to enable seamless interpretation and
      generation across multiple modalities within a unified framework, yet
      their ability to preserve relationships across modalities remains
      uncertain. Do unified models truly achieve cross-modal coherence, or is
      this coherence merely perceived? To explore this, we introduce ACON, a
      dataset of 1,000 images (500 newly contributed) paired with captions,
      editing instructions, and Q&A pairs to evaluate cross-modal transfers
      rigorously. Using three consistency criteria—cyclic consistency, forward
      equivariance, and conjugated equivariance—our experiments reveal that
      any-to-any models do not consistently demonstrate greater cross-modal
      consistency than specialized models in pointwise evaluations such as
      cyclic consistency. However, equivariance evaluations uncover weak but
      observable consistency through structured analyses of the intermediate
      latent space enabled by multiple editing operations.
    selected: y

